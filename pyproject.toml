[project]
name = "pageloom"
version = "0.3.0"
description = "Python automation pipeline for designing and self-publishing children's books on Amazon KDP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "diffusers>=0.25",
  "pillow>=10.0",
  "pypdf>=4.0",
  "transformers>=4.40",
  "torch>=2.2",
  "openai>=3.13.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pymupdf>=1.28.2"]

[project.scripts]
pageloom = "pageloom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Backend config notes:
# - MPS (macOS Apple Silicon): torch.set_default_device('mps') or set device='mps' in diffusers pipelines.
# - CPU: default fallback; set torch.set_num_threads(...) for parallelism.
# - CUDA: requires torch with CUDA support; set device='cuda' in diffusers and ensure CUDA_VISIBLE_DEVICES is set.
# The same Python code runs on all three backends with no behavioral differences.

[tool.hatch.build.targets.wheel]
packages = ["src/pageloom"]

# On Linux (the agentloop Docker container has no GPU passthrough), pull the
# CPU-only torch wheel instead of the default CUDA build. The default build
# bundles nvidia-* packages (cusparselt, cublas, etc.) extracted to temp dirs
# at install time; under uv's resolver this has repeatedly produced broken
# installs (missing libcusparseLt.so.0, torch segfaulting with a core dump)
# that made agent sessions loop for hours. macOS keeps the default PyPI wheel
# (MPS-capable, no CUDA bloat to begin with).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
